# Alembic: versioned database migrations.
#
#   .venv/Scripts/python -m alembic upgrade head        apply every migration
#   .venv/Scripts/python -m alembic current             which migration the DB is at
#   .venv/Scripts/python -m alembic revision --autogenerate -m "add x"   draft a new one
#
# The database URL is NOT stored here: migrations/env.py reads DATABASE_URL from
# backend/.env (the same setting the app uses), so there is one source of truth.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

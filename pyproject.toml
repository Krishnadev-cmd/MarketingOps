[project]
name = "marketing-ops-backend"
version = "0.1.0"
description = "Marketing Operations Console: content studio, approval workflow and compliance checker"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "cryptography>=42",
    "email-validator>=2.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "groq>=0.30",
    "psycopg>=3.3.6",
    "pydantic-settings>=2.4",
    "pyjwt>=2.8",
    "pymysql>=1.1",
    "pytest>=8.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
